name: tani_mobile
description: Klien native Kelompok Tani Podokoyo untuk Android dan iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
  intl: 0.20.3
  path_provider: 2.1.6
  share_plus: 13.3.1
  image_picker: 1.2.4
  url_launcher: 6.3.3
  firebase_core: 5.0.0
  firebase_messaging: 17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
